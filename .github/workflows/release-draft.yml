name: Release draft

# Release tags follow Debian versioning: v<upstream version>-<revision>, for example v1.6.1-1.
on:
  push:
    tags: [ 'v*-*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to draft, for example v1.6.1-1
        required: true

permissions:
  contents: write

concurrency:
  group: release-draft-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      UPSTREAM_REPO: https://github.com/ValveSoftware/GameNetworkingSockets.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.TAG }}

      - name: Parse the tag
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "::error::$TAG is not a release tag of the form v<upstream>-<revision>, for example v1.6.1-1"
            exit 1
          fi
          echo "UPSTREAM_TAG=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "UPSTREAM_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "REVISION=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - name: Fetch the upstream tag
        run: |
          git fetch --no-tags "$UPSTREAM_REPO" "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          if ! git merge-base --is-ancestor "$UPSTREAM_TAG" "$TAG"; then
            echo "::error::$TAG is not based on upstream $UPSTREAM_TAG"
            exit 1
          fi

      - name: Find the previous release
        run: |
          # The previous release is the closest older release tag of the same upstream version.
          PREVIOUS=$(git tag --list "v${UPSTREAM_VERSION}-*" \
            | awk -F- -v cur="$REVISION" 'NF == 2 && $2 ~ /^[0-9]+$/ && $2 + 0 < cur + 0' \
            | sort -V | tail -n 1)
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"

      - name: Hash the source archive
        run: |
          # vcpkg_from_github downloads this archive and checks it against the SHA512.
          curl -fsSL --retry 5 --retry-delay 5 -o source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/${TAG}.tar.gz"
          echo "SHA512=$(sha512sum source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Write the release notes
        run: |
          {
            echo "Based on upstream [${UPSTREAM_TAG}](https://github.com/ValveSoftware/GameNetworkingSockets/releases/tag/${UPSTREAM_TAG})."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "## Changes since ${PREVIOUS}"
              echo
              git log --no-merges --reverse --format='- %s (%h)' "${PREVIOUS}..${TAG}"
              echo
            fi
            echo "## Changes from upstream ${UPSTREAM_TAG}"
            echo
            git log --no-merges --reverse --format='- %s (%h)' "${UPSTREAM_TAG}..${TAG}"
            echo
            echo "## vcpkg"
            echo
            echo '```cmake'
            echo 'vcpkg_from_github('
            echo '    OUT_SOURCE_PATH SOURCE_PATH'
            echo "    REPO ${GITHUB_REPOSITORY}"
            echo "    REF \"${TAG}\""
            echo "    SHA512 ${SHA512}"
            echo '    HEAD_REF main'
            echo ')'
            echo '```'
            echo
            echo "Port version: \`\"version\": \"${UPSTREAM_VERSION}\"\`, \`\"port-version\"\` is the client port's own counter."
          } > notes.md
          cat notes.md

      - name: Create or update the draft release
        run: |
          STATE=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          if [ "$STATE" = missing ]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md
          elif [ "$STATE" = true ]; then
            gh release edit "$TAG" --notes-file notes.md
          else
            echo "::warning::$TAG is already published, its notes are left unchanged"
          fi
